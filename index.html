<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Блокнот-скан</title>
</head>
<body>
  <div id="boot" style="font-family:system-ui;padding:24px">Запуск приложения…</div>
  <script>
    (async () => {
      async function unpackBase64Gzip(text) {
        const b64 = text.trim();
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text();
      }

      const names = ['chunk1.txt','chunk2.txt','chunk3.txt','chunk4.txt'];
      const parts = await Promise.all(names.map(async name => {
        const r = await fetch(name, {cache:'no-store'});
        if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
        return r.text();
      }));

      let html = await unpackBase64Gzip(parts.join(''));
      html = html.replace(
        "const queue = (await getAll('sync_queue')).filter(q=>q.status==='pending' && q.entity==='photo');",
        "const queue = (await getAll('sync_queue')).filter(q=>(q.status==='pending' || q.status==='failed') && q.entity==='photo');"
      );

      // Load v3 before document.write. This avoids Android Chrome dropping a
      // dynamically inserted external script while the document is replaced.
      try {
        const v3Response = await fetch('./v3-enhancements.txt?v=3.0.1', {cache:'no-store'});
        if (!v3Response.ok) throw new Error(`v3-enhancements.txt: HTTP ${v3Response.status}`);
        let v3 = await unpackBase64Gzip(await v3Response.text());
        v3 = v3.replace(/<\/script/gi, '<\\/script');
        const v3Tag = '<script>window.__BLOCKNOT_V3_BOOTSTRAP__="3.0.1";\n' + v3 + '\n<' + '/script>';
        html = html.replace('</body>', v3Tag + '</body>');
      } catch (err) {
        console.error('Блокнот-скан v3: дополнения не загрузились, остаётся стабильная v2', err);
      }

      document.open();
      document.write(html);
      document.close();
    })().catch(err => {
      document.body.innerHTML = `<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">Ошибка запуска приложения:\n${String(err)}</pre>`;
    });
  </script>
</body>
</html>
