<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Блокнот-скан</title>
</head>
<body>
  <div id="boot" style="font-family:system-ui;padding:24px">Запуск приложения…</div>
  <script>
    (async () => {
      const APP_VERSION = '3.3.4';

      async function unpackBase64Gzip(text) {
        const b64 = text.trim();
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text();
      }

      async function fetchTextWithOfflineFallback(path) {
        let firstError = null;
        try {
          const r = await fetch(`${path}?v=${encodeURIComponent(APP_VERSION)}`, {cache:'no-store'});
          if (r.ok) return await r.text();
          firstError = new Error(`${path}: HTTP ${r.status}`);
        } catch (e) {
          firstError = e;
        }
        try {
          const fallback = await fetch(path, {cache:'default'});
          if (fallback.ok) return await fallback.text();
          throw new Error(`${path}: HTTP ${fallback.status}`);
        } catch (fallbackError) {
          throw firstError || fallbackError;
        }
      }

      const names = ['chunk1.txt','chunk2.txt','chunk3.txt','chunk4.txt'];
      const parts = await Promise.all(names.map(async name => {
        try {
          const r = await fetch(name, {cache:'no-store'});
          if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
          return r.text();
        } catch (networkError) {
          const cached = await fetch(name, {cache:'default'});
          if (!cached.ok) throw networkError;
          return cached.text();
        }
      }));

      let html = await unpackBase64Gzip(parts.join(''));
      html = html.replace(
        "const queue = (await getAll('sync_queue')).filter(q=>q.status==='pending' && q.entity==='photo');",
        "const queue = (await getAll('sync_queue')).filter(q=>(q.status==='pending' || q.status==='failed') && q.entity==='photo');"
      );

      const originalVersion = 'Блокнот-скан · прототип';
      try {
        const v3 = await unpackBase64Gzip(await fetchTextWithOfflineFallback('./v3-enhancements.txt'));
        const fixes = await fetchTextWithOfflineFallback('./v3-fixes.js');
        const hotfix = await fetchTextWithOfflineFallback('./v3-hotfix.js');
        const collab = await fetchTextWithOfflineFallback('./v3-collab.js');
        const ux = await fetchTextWithOfflineFallback('./v3-ux323.js');
        const auditfix = await fetchTextWithOfflineFallback('./v3-auditfix.js');
        const polish = await fetchTextWithOfflineFallback('./v3-polish326.js');
        const crop = await fetchTextWithOfflineFallback('./v3-crop327.js');
        const ui328 = await fetchTextWithOfflineFallback('./v3-ui328.js');
        const history329 = await fetchTextWithOfflineFallback('./v3-history329.js');
        const viewer331 = await fetchTextWithOfflineFallback('./v3-viewer331.js');
        const member332 = await fetchTextWithOfflineFallback('./v3-member332.js');
        const history333 = await fetchTextWithOfflineFallback('./v3-history333.js');
        const orientation334 = await fetchTextWithOfflineFallback('./v3-orientation334.js');

        const marker = '// ===================== INIT =====================';
        if (!html.includes(marker)) throw new Error('INIT marker not found');
        html = html.replace(marker, v3 + '\n\n' + fixes + '\n\n' + hotfix + '\n\n' + collab + '\n\n' + ux + '\n\n' + auditfix + '\n\n' + polish + '\n\n' + crop + '\n\n' + ui328 + '\n\n' + history329 + '\n\n' + viewer331 + '\n\n' + member332 + '\n\n' + history333 + '\n\n' + orientation334 + '\n\n' + marker);
        html = html.replace(originalVersion, `Блокнот-скан · v${APP_VERSION} · Рабочие схемы`);
      } catch (err) {
        const msg = String(err && err.message ? err.message : err).replace(/[<>]/g, '');
        html = html.replace(originalVersion, `Блокнот-скан · v3 ERROR · ${msg}`);
        console.error('Блокнот-скан v3: дополнения не встроились, остаётся стабильная v2', err);
      }

      document.open();
      document.write(html);
      document.close();
    })().catch(err => {
      document.body.innerHTML = `<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">Ошибка запуска приложения:\n${String(err)}</pre>`;
    });
  </script>
</body>
</html>
