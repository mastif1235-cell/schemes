<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Блокнот-скан</title>
</head>
<body>
  <div id="boot" style="font-family:system-ui;padding:24px">Запуск приложения…</div>
  <script>
    const RELOAD_GUARD = 'blocknot_release_reload_once';
    (async () => {
      let release = '';

      async function unpackBase64Gzip(text) {
        const b64 = text.trim();
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text();
      }

      async function fetchTextWithOfflineFallback(path) {
        let firstError = null;
        try {
          const r = await fetch(release ? `${path}?v=${encodeURIComponent(release)}` : path, {cache:'no-store'});
          if (r.ok) return await r.text();
          firstError = new Error(`${path}: HTTP ${r.status}`);
        } catch (e) {
          firstError = e;
        }
        try {
          const fallback = await fetch(path, {cache:'reload'});
          if (fallback.ok) return await fallback.text();
          throw new Error(`${path}: HTTP ${fallback.status}`);
        } catch (fallbackError) {
          throw firstError || fallbackError;
        }
      }

      async function sha256(text) {
        const bytes = new TextEncoder().encode(text);
        const hash = await crypto.subtle.digest('SHA-256', bytes);
        return [...new Uint8Array(hash)].map(byte => byte.toString(16).padStart(2, '0')).join('');
      }

      const manifest = JSON.parse(await fetchTextWithOfflineFallback('./app-v3-manifest.json'));
      const APP_VERSION = JSON.parse(await fetchTextWithOfflineFallback('./version.json')).version;
      release = APP_VERSION;
      if (manifest.version !== APP_VERSION || !Array.isArray(manifest.files)) {
        throw new Error('Несовместимая версия runtime manifest');
      }
      const loaded = await Promise.all(manifest.files.map(async entry => {
        const text = await fetchTextWithOfflineFallback('./' + entry.path);
        // Hash normalized line endings so a Windows checkout, a CDN rewrite or a git autocrlf
        // working tree cannot turn a healthy release into a boot failure.
        const actual = await sha256(text.replace(/\r\n?/g, '\n'));
        if (actual !== entry.sha256) throw new Error(`Проверка целостности не пройдена: ${entry.path}`);
        return [entry.path, text];
      }));
      const files = Object.fromEntries(loaded);
      const chunks = ['chunk1.txt','chunk2.txt','chunk3.txt','chunk4.txt'];
      if (chunks.some(name => !files[name])) throw new Error('В manifest отсутствует базовый runtime');
      let html = await unpackBase64Gzip(chunks.map(name => files[name]).join(''));

      const runtimeParts = [];
      for (const entry of manifest.files) {
        if (chunks.includes(entry.path)) continue;
        runtimeParts.push(files[entry.path]);
      }
      const marker = '// ===================== INIT =====================';
      if (!html.includes(marker)) throw new Error('INIT marker not found');
      const versionBridge = 'window.__BLOCKNOT_APP_VERSION__ = ' + JSON.stringify(APP_VERSION) + ';\n\n';
      html = html.replace(marker, versionBridge + runtimeParts.join('\n\n') + '\n\n' + marker);
      html = html.replace('Блокнот-скан · прототип', `Блокнот-скан · v${APP_VERSION} · Stable`);

      document.open();
      document.write(html);
      document.close();
      setupReleaseUpdates();
    })().catch(err => {
      const message = String(err && err.message ? err.message : err).replace(/[<>]/g, '');
      document.body.innerHTML = `<div style="font-family:system-ui;padding:24px;max-width:680px;margin:auto"><h1>Приложение не запущено</h1><p>Не удалось загрузить согласованную версию приложения. Данные на устройстве не изменены.</p><pre style="white-space:pre-wrap">${message}</pre><button onclick="location.reload()">Повторить</button></div>`;
    });

    function overlayOpen() {
      return !!document.querySelector('.sheet-backdrop, .viewer');
    }

    // At most one automatic reload per session. Data lives in IndexedDB, but a reload while a
    // camera/crop/viewer sheet is open could drop an unfinished photo, so updates wait for idle.
    function reloadOnce() {
      try {
        if (sessionStorage.getItem(RELOAD_GUARD) === '1') return;
        sessionStorage.setItem(RELOAD_GUARD, '1');
      } catch (error) {
        console.warn('Release reload guard could not be persisted', error);
      }
      location.reload();
    }

    function setupReleaseUpdates() {
      if (!('serviceWorker' in navigator)) return;
      const wasControlled = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!wasControlled) return;
        if (overlayOpen()) {
          const retry = () => {
            if (overlayOpen()) return;
            window.removeEventListener('pointerdown', retry, true);
            reloadOnce();
          };
          window.addEventListener('pointerdown', retry, true);
          return;
        }
        reloadOnce();
      });
      navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(registration => {
        if (!registration) return;
        const activateWhenIdle = () => {
          if (!registration.waiting || overlayOpen()) return;
          registration.waiting.postMessage({type:'SKIP_WAITING'});
        };
        activateWhenIdle();
        registration.addEventListener('updatefound', () => {
          const worker = registration.installing;
          if (worker) worker.addEventListener('statechange', () => { if (worker.state === 'installed') activateWhenIdle(); });
        });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') activateWhenIdle(); });
        window.addEventListener('pointerdown', activateWhenIdle, true);
      }).catch(error => console.warn('Service worker registration failed', error));
    }
  </script>
</body>
</html>
