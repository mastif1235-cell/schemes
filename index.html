<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Блокнот-скан</title>
</head>
<body>
  <div id="boot" style="font-family:system-ui;padding:24px">Запуск приложения…</div>
  <script>
    (async () => {
      async function unpackBase64Gzip(text) {
        const b64 = text.trim();
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(stream).text();
      }

      const names = ['chunk1.txt','chunk2.txt','chunk3.txt','chunk4.txt'];
      const parts = await Promise.all(names.map(async name => {
        const r = await fetch(name, {cache:'no-store'});
        if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
        return r.text();
      }));

      let html = await unpackBase64Gzip(parts.join(''));
      html = html.replace(
        "const queue = (await getAll('sync_queue')).filter(q=>q.status==='pending' && q.entity==='photo');",
        "const queue = (await getAll('sync_queue')).filter(q=>(q.status==='pending' || q.status==='failed') && q.entity==='photo');"
      );

      const originalVersion = 'Блокнот-скан · прототип';
      try {
        let r = await fetch('./v3-enhancements.txt?v=3.2.1', {cache:'no-store'});
        if (!r.ok) r = await fetch('./v3-enhancements.txt', {cache:'reload'});
        if (!r.ok) throw new Error(`v3-enhancements.txt: HTTP ${r.status}`);
        const v3 = await unpackBase64Gzip(await r.text());

        let fixResp = await fetch('./v3-fixes.js?v=3.2.1', {cache:'no-store'});
        if (!fixResp.ok) fixResp = await fetch('./v3-fixes.js', {cache:'reload'});
        if (!fixResp.ok) throw new Error(`v3-fixes.js: HTTP ${fixResp.status}`);
        const fixes = await fixResp.text();

        let hotfixResp = await fetch('./v3-hotfix.js?v=3.2.1', {cache:'no-store'});
        if (!hotfixResp.ok) hotfixResp = await fetch('./v3-hotfix.js', {cache:'reload'});
        if (!hotfixResp.ok) throw new Error(`v3-hotfix.js: HTTP ${hotfixResp.status}`);
        const hotfix = await hotfixResp.text();

        const marker = '// ===================== INIT =====================';
        if (!html.includes(marker)) throw new Error('INIT marker not found');
        html = html.replace(marker, v3 + '\n\n' + fixes + '\n\n' + hotfix + '\n\n' + marker);
        html = html.replace(originalVersion, 'Блокнот-скан · v3.2.1 · Рабочие схемы');
      } catch (err) {
        const msg = String(err && err.message ? err.message : err).replace(/[<>]/g, '');
        html = html.replace(originalVersion, `Блокнот-скан · v3 ERROR · ${msg}`);
        console.error('Блокнот-скан v3: дополнения не встроились, остаётся стабильная v2', err);
      }

      document.open();
      document.write(html);
      document.close();
    })().catch(err => {
      document.body.innerHTML = `<pre style="white-space:pre-wrap;font-family:system-ui;padding:24px">Ошибка запуска приложения:\n${String(err)}</pre>`;
    });
  </script>
</body>
</html>
