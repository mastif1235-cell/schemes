name: Validate runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated artifacts
        run: npm run check:generated
      - name: Syntax
        shell: bash
        run: |
          node --check sw.js
          node --check v3-enhancements.js
          node --check backend/worker.js
          node --check tools/build-rollback.mjs
          for file in tests/*.mjs tests/team-preview-fixture.js; do node --check "$file"; done
          for file in v3-*.js; do node --check "$file"; done
      - name: Regression tests
        run: npm test

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser test tools
        run: npm install --no-save --ignore-scripts playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build rollback frontend
        run: npm run build:rollback && npm run test:rollback
      - name: Standalone Chromium runtime
        run: npm run test:runtime && npm run test:idb
      - uses: actions/upload-artifact@v4
        with:
          name: rollback-v3.4.2-compatible-${{ github.sha }}
          path: rollback/v3.4.2-compatible
          if-no-files-found: error
